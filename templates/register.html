<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - PocketSmart AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md card">
  <div class="text-center mb-6">
    <div class="text-5xl mb-2">✨</div>
    <h1 class="text-2xl font-bold">Create Account</h1>
    <p class="text-gray-500 text-sm">PocketSmart AI la join pannu da!</p>
  </div>

  <form onsubmit="register(event)" class="space-y-4">
    <div>
      <label class="text-sm font-semibold">Full Name</label>
      <input type="text" required class="input-field" placeholder="Swetha">
    </div>
    <div>
      <label class="text-sm font-semibold">Email</label>
      <input type="email" required class="input-field" placeholder="swetha@gmail.com">
    </div>
    <div>
      <label class="text-sm font-semibold">Password</label>
      <input type="password" required class="input-field" placeholder="••••••">
    </div>
    <div>
      <label class="text-sm font-semibold">Monthly Budget</label>
      <input type="number" class="input-field" placeholder="50000" value="50000">
    </div>
    
    <button type="submit" class="w-full btn-primary py-3">
      Create Account 🚀
    </button>
  </form>

  <p class="text-center text-sm mt-4">Already have account? <a href="/login" class="text-[#FF6B6B] font-bold">Login</a></p>
  <p class="text-center text-xs mt-2"><a href="/" class="text-gray-400 underline">Skip → Dashboard</a></p>
</div>

<script>
function register(e){
  e.preventDefault();
  alert("Account created da Swetha! 🎉");
  window.location.href = "/";
}
</script>
<script src="/static/js/app.js"></script>
</body>
</html>
