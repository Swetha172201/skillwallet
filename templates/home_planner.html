<!DOCTYPE html>
<html>
<head>
    <title>Pocket Smart AI - Home Planner</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; padding: 20px; text-align: center; }
        .box { background: white; max-width: 600px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #6c5ce7; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #5a4bd1; }
        #result { text-align: left; background: #f0f0ff; padding: 15px; border-radius: 10px; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🏠 Pocket Smart AI - Budget Planner</h2>
        <p>2.5 Flash Real AI da!</p>
        
        <input id="income" type="number" placeholder="Monthly Income - ex: 30000">
        <input id="prompt" type="text" placeholder="Ex: Monthly budget for student, family of 4">
        <button onclick="generate()">✨ Generate Real Budget</button>
        
        <div id="result">Result inga varum da chellam...</div>
    </div>

<script>
async function generate() {
    let income = document.getElementById('income').value || 30000;
    let prompt = document.getElementById('prompt').value || "Monthly budget";
    
    document.getElementById('result').innerText = "⏳ Gemini 2.5 Flash generate pannuthu da... wait pannu chellam...";

    try {
        let res = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ prompt: `${prompt} for income ${income}`, income: income })
        });
        
        let data = await res.json();
        
        if(data.status === "success"){
            document.getElementById('result').innerText = "✅ Success da! Real Budget:\n\n" + JSON.stringify(data.data, null, 2);
        } else {
            document.getElementById('result').innerText = "❌ Error da: " + JSON.stringify(data, null, 2);
        }
    } catch (e) {
        document.getElementById('result').innerText = "❌ Error da: " + e;
    }
}
</script>
</body>
</html>
